<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOM Element Selectors Assignment</title>
</head>
<body>

  <!-- Task 1: Select Element by ID -->
  <h1 id="main-heading">Welcome Student</h1>

  <!-- Task 2: Select Elements by Tag Name -->
  <p>Paragraph 1: Initial text here.</p>
  <p>Paragraph 2: Another paragraph text.</p>
  <p>Paragraph 3: Third paragraph text.</p>

  <!-- Task 3: Select Elements by Class Name -->
  <button class="btn">Button 1</button>
  <button class="btn">Button 2</button>

  <!-- Task 4: Use querySelector -->
  <h2 class="sub-heading">Task 4 Heading</h2>
  <p class="task4-text">Task 4 paragraph content.</p>

  <!-- Task 5: Use querySelectorAll -->
  <ul>
    <li>Item 1</li>
    <li>Item 2</li>
    <li>Item 3</li>
    <li>Item 4</li>
  </ul>

  <!-- Task 6: Change Style Using Selected Element -->
  <p class="styled-paragraph">This text will be styled using JavaScript.</p>

  <!-- External JavaScript File -->
  <script src="script.js"></script>
</body>
</html>
